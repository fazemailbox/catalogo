<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>{% block title %}Catálogo{% endblock %}</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1000px;margin:2rem auto;padding:0 1rem}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #ddd;padding:.4rem;text-align:left}
.msg{padding:.5rem;background:#fff3cd;margin:.5rem 0;border-radius:4px}
label{display:block;margin:.7rem 0 .2rem;font-weight:600}
input,select,textarea{width:100%;padding:.35rem;box-sizing:border-box}
input[type=checkbox]{width:auto}.chk label{display:inline;font-weight:400;margin-right:1rem}
.ok{color:#0a7a2f}.no{color:#b00}form.inline{display:inline}.row{display:flex;gap:.5rem}
</style></head><body>
<nav><a href="{{ url_for('catalogo.listar_libros') }}">Catálogo</a> |
<a href="{{ url_for('catalogo.form_libro') }}">+ Nuevo libro</a></nav><hr>
{% for m in get_flashed_messages() %}<div class="msg">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</body></html>
